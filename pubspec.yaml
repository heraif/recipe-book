name: recipe_book
description: A Firebase-powered Recipe Book Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter



